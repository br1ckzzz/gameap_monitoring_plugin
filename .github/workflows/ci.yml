name: CI Build & Verify

on:
  push:
    branches: [ "main", "master", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build WebAssembly Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Sync frontend assets to rust crate
        run: |
          mkdir -p rust-plugin/assets
          cp -rf frontend/* rust-plugin/assets/

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Compile & Optimize WASM Plugin (Rust wasm32-wasip1)
        working-directory: rust-plugin
        run: |
          cargo build --target wasm32-wasip1 --release
          wasm-opt -Oz target/wasm32-wasip1/release/gameap_web_monitoring.wasm -o ../web_monitoring.wasm

      - name: Verify WASM binary
        run: |
          test -f web_monitoring.wasm
          ls -lh web_monitoring.wasm
