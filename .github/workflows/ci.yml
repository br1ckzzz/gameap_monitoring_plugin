name: CI Build & Verify

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build WebAssembly Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Sync frontend assets to plugin
        run: |
          mkdir -p plugin/assets
          cp -r frontend/* plugin/assets/

      - name: Compile WASM Plugin
        working-directory: plugin
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o ../web_monitoring.wasm .

      - name: Verify WASM binary
        run: |
          test -f web_monitoring.wasm
          ls -lh web_monitoring.wasm
