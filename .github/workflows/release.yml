name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Sync frontend assets to plugin
        run: |
          mkdir -p plugin/assets
          cp -r frontend/* plugin/assets/

      - name: Compile WASM Plugin
        working-directory: plugin
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o ../web_monitoring.wasm .

      - name: Sign wasm (Optional GPG)
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        if: env.GPG_SIGNING_KEY != ''
        run: |
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor -o web_monitoring.wasm.asc web_monitoring.wasm

      - name: Publish to plugins.gameap.dev
        env:
          GAMEAP_DEPLOY_TOKEN: ${{ secrets.GAMEAP_DEPLOY_TOKEN }}
          GAMEAP_PLUGIN_ID: ${{ vars.GAMEAP_PLUGIN_ID }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$GAMEAP_DEPLOY_TOKEN" ]; then
            echo "::warning::GAMEAP_DEPLOY_TOKEN secret is not set. Skipping automatic publish to plugins.gameap.dev. Configure GAMEAP_DEPLOY_TOKEN in repository secrets to enable automatic publishing."
            exit 0
          fi

          PLUGIN_ID="${GAMEAP_PLUGIN_ID:-monitoring}"
          VERSION="${TAG#v}"

          if [ -n "$RELEASE_BODY" ]; then
            printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/changelog.md"
          else
            printf 'Release %s' "$TAG" > "$RUNNER_TEMP/changelog.md"
          fi

          ARGS=(-sS
            -o "$RUNNER_TEMP/response.json"
            -w "%{http_code}"
            -H "Authorization: Bearer ${GAMEAP_DEPLOY_TOKEN}"
            -F "version=${VERSION}"
            -F "file=@web_monitoring.wasm"
            -F "changelog=<${RUNNER_TEMP}/changelog.md")

          if [ -f "web_monitoring.wasm.asc" ]; then
            ARGS+=(-F "signature=@web_monitoring.wasm.asc")
          fi

          if [ "$PRERELEASE" != "true" ]; then
            ARGS+=(-F "is_stable=true")
          fi

          echo "Publishing version ${VERSION} for plugin ${PLUGIN_ID} to plugins.gameap.dev..."
          STATUS=$(curl "${ARGS[@]}" \
            "https://plugins.gameap.dev/api/ci/plugins/${PLUGIN_ID}/versions")

          cat "$RUNNER_TEMP/response.json"
          echo
          if [ "$STATUS" != "201" ]; then
            echo "::error::Publish to plugins.gameap.dev failed with HTTP $STATUS"
            exit 1
          fi
          echo "Successfully published version ${VERSION} to plugins.gameap.dev!"

      - name: Create or Update GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web_monitoring.wasm
            web_monitoring.wasm.asc
          generate_release_notes: true
